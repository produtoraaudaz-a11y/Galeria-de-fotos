name: Publicar galeria

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html styles.css app.js robots.txt _site/
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

  package-originals:
    name: Gerar ZIP dos originais
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Baixar fotos oficiais do Drive
        run: |
          python -m pip install --disable-pip-version-check --quiet gdown
          mkdir -p originals
          gdown --folder "https://drive.google.com/drive/folders/1wyF3JigBsfORegKIvDlEle8OQDtkwo7_" -O originals

      - name: Montar pacote em alta resolução
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path('originals')
          output = Path('Colares-Estacio_Fotos-Corporativas_AUDAZ.zip')
          images = sorted(p for p in source.rglob('*') if p.is_file() and p.suffix.lower() in {'.jpg', '.jpeg', '.png'})

          if not images:
              raise SystemExit('Nenhuma imagem foi baixada do Drive.')

          with ZipFile(output, 'w', ZIP_DEFLATED, compresslevel=6) as archive:
              for image in images:
                  archive.write(image, image.name)

          print(f'Pacote criado com {len(images)} fotografias: {output}')
          PY

      - name: Criar ou atualizar release de entrega
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="Colares-Estacio_Fotos-Corporativas_AUDAZ.zip"
          TAG="galeria-atual"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "Galeria Colares & Estácio" --notes "Pacote completo em alta resolução. Gerado automaticamente a partir da pasta oficial de entrega da AUDAZ."
          else
            gh release create "$TAG" "$ASSET" --title "Galeria Colares & Estácio" --notes "Pacote completo em alta resolução. Gerado automaticamente a partir da pasta oficial de entrega da AUDAZ."
          fi
